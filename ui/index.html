<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Fresta Inspetor</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <aside class="side">
    <div class="brand">
      <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="17" fill="none" stroke="currentColor" stroke-width="2.4"/>
        <rect x="9.5" y="15.5" width="21" height="9" rx="4.5" fill="#000" stroke="rgba(255,255,255,.18)"/>
        <circle cx="25.5" cy="20" r="1.8" class="mark-eye"/>
      </svg>
      <div>
        <div class="brand-name">Inspetor</div>
        <div class="brand-sub">da Fresta</div>
      </div>
    </div>

    <div class="who" id="who"></div>

    <nav class="nav" id="nav">
      <button data-page="geral"><svg viewBox="0 0 24 24"><path d="M4 14a8 8 0 0 1 16 0"/><path d="M12 14l4.2-4.2"/><circle cx="12" cy="14" r="1.4"/><path d="M4 19h16"/></svg><span>Visão geral</span><b data-k="geral"></b></button>
      <button data-page="rede"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17"/><path d="M12 3.5c2.6 2.4 3.9 5.2 3.9 8.5s-1.3 6.1-3.9 8.5c-2.6-2.4-3.9-5.2-3.9-8.5s1.3-6.1 3.9-8.5z"/></svg><span>Rede</span><b data-k="rede"></b></button>
      <button data-page="arquivos"><svg viewBox="0 0 24 24"><path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2.2h7a2 2 0 0 1 2 2v7.8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></svg><span>Arquivos</span><b data-k="arquivos"></b></button>
      <button data-page="programas"><svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M3.5 9h17"/><path d="M8 13l2 1.8-2 1.8"/><path d="M12.5 16.6h3.5"/></svg><span>Programas</span><b data-k="programas"></b></button>
      <button data-page="sensores"><svg viewBox="0 0 24 24"><rect x="9" y="3.5" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0"/><path d="M12 18v2.5"/></svg><span>Sensores</span><b data-k="sensores"></b></button>
      <button data-page="chaves"><svg viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M11 12.2L19.5 4"/><path d="M16 7.5l2.5 2.5"/><path d="M14 9.5l1.8 1.8"/></svg><span>Chaves</span><b data-k="chaves"></b></button>
      <button data-page="trava"><svg viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8.5 10.5V7.8a3.5 3.5 0 0 1 7 0v2.7"/><circle cx="12" cy="15.5" r="1.3"/></svg><span>Trava</span><b data-k="trava"></b></button>
    </nav>

    <div class="side-foot">
      <button class="foot-link" data-page="lista"><svg viewBox="0 0 24 24"><path d="M7 4.5h7.5L18 8v11.5H7z"/><path d="M14.5 4.5V8H18"/><path d="M9.5 12h5.5M9.5 15.5h5.5"/></svg><span>A lista pública</span></button>
      <button class="foot-link" data-open="codigo"><svg viewBox="0 0 24 24"><path d="M9 8l-4 4 4 4"/><path d="M15 8l4 4-4 4"/></svg><span>Código aberto · MIT</span></button>
    </div>
  </aside>

  <main class="main" id="main">
    <div class="banner" id="banner" hidden></div>
    <section class="page" id="page"></section>
  </main>

  <div class="tip" id="tip" hidden></div>
  <script src="app.js"></script>
</body>
</html>
